<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#081325"/>
      <stop offset="100%" stop-color="#020914"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Brand Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#00e5ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#00e5ff" stroke-width="0.7" stroke-opacity="0.06"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="slightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.35; }
    }
    @keyframes sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes ringPulse {
      0% { r: 6; opacity: 1; }
      100% { r: 24; opacity: 0; }
    }
    @keyframes borderPulse {
      0%, 100% { stroke-opacity: 0.6; }
      50% { stroke-opacity: 0.2; }
    }
    @keyframes floatBeam {
      0% { transform: translateX(0); }
      50% { transform: translateX(40px); }
      100% { transform: translateX(0); }
    }
    .radar-rotator {
      transform-origin: 780px 120px;
      animation: sweep 4s linear infinite;
    }
    .radar-ping {
      transform-origin: 780px 120px;
      animation: ringPulse 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .status-dot {
      animation: pulse 1.5s ease-in-out infinite;
    }
    .border-glow {
      animation: borderPulse 3s ease-in-out infinite;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
  </style>

  <!-- Background Base -->
  <rect x="2" y="2" width="896" height="236" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Grid Matrix -->
  <rect x="2" y="2" width="896" height="236" rx="14" fill="url(#gridPattern)"/>

  <!-- Border Outline -->
  <rect class="border-glow" x="2" y="2" width="896" height="236" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Top Pill Badge -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="375" height="26" rx="13" fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1"/>
    <circle class="status-dot" cx="16" cy="13" r="4" fill="#00e5ff" filter="url(#slightGlow)"/>
    <text x="28" y="17" fill="#00e5ff" font-size="10.5" font-weight="700" letter-spacing="1.2" class="font-sans">
      FORESIGHT &amp; ANALYTICAL ENGINEERING • 2026
    </text>
  </g>

  <!-- VB Monogram Box -->
  <g transform="translate(36, 72)">
    <rect x="0" y="0" width="56" height="48" rx="8" fill="#00e5ff" fill-opacity="0.06" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="28" y="32" fill="#00e5ff" font-size="22" font-weight="900" text-anchor="middle" class="font-mono" filter="url(#slightGlow)">VB</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(104, 108)">
    <text fill="url(#textGrad)" font-size="34" font-weight="900" letter-spacing="-0.5" class="font-sans" filter="url(#glow)">
      vbrion analytics
    </text>
  </g>

  <!-- Subtitle / Tagline -->
  <g transform="translate(36, 150)">
    <text fill="#94a3b8" font-size="14.5" font-weight="500" class="font-sans">
      Looking Beyond The Curve — <tspan fill="#38bdf8" font-weight="700">Engineering What's Next</tspan>
    </text>
  </g>

  <!-- Tag Pills -->
  <g transform="translate(36, 178)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="168" height="26" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="84" y="17" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">⚡ Strategic Advisory (6)</text>

    <!-- Pill 2 -->
    <rect x="178" y="0" width="186" height="26" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="271" y="17" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">🧠 Analytical Solutions (5)</text>

    <!-- Pill 3 -->
    <rect x="374" y="0" width="176" height="26" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="462" y="17" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">🛡️ Regulatory Defense</text>

    <!-- Pill 4 -->
    <rect x="560" y="0" width="155" height="26" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <text x="637" y="17" fill="#94a3b8" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">🚀 Cloud Architecture</text>
  </g>

  <!-- Right Side Interactive Stargazer Radar -->
  <g transform="translate(0, 0)">
    <!-- Outer dashed circle -->
    <circle cx="780" cy="120" r="76" fill="none" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- Middle ring -->
    <circle cx="780" cy="120" r="52" fill="none" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1"/>
    <!-- Inner ring -->
    <circle cx="780" cy="120" r="28" fill="none" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Crosshairs -->
    <line x1="700" y1="120" x2="860" y2="120" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="0.8"/>
    <line x1="780" y1="40" x2="780" y2="200" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="0.8"/>
    
    <!-- Radar rotating scanner sweep -->
    <g class="radar-rotator">
      <path d="M 780 120 L 856 120 A 76 76 0 0 1 833 173 Z" fill="url(#radarSweep)"/>
      <line x1="780" y1="120" x2="856" y2="120" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.9"/>
    </g>

    <!-- Radar Target Ping -->
    <circle class="radar-ping" cx="780" cy="120" r="6" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <circle cx="780" cy="120" r="4.5" fill="#00e5ff" filter="url(#glow)"/>

    <!-- Target Dots in Constellation -->
    <circle cx="810" cy="95" r="2.5" fill="#38bdf8" class="status-dot"/>
    <circle cx="750" cy="145" r="2" fill="#38bdf8" opacity="0.8"/>
    <circle cx="820" cy="155" r="2" fill="#38bdf8" opacity="0.6"/>

    <text x="780" y="214" fill="#00e5ff" font-size="9" font-weight="700" letter-spacing="1.5" text-anchor="middle" class="font-mono">
      HORIZON PROTOCOL ACTIVE
    </text>
  </g>
</svg>