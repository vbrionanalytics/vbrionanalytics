<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#00e5ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="65%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowDiv" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes sweepPulse {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(900px); }
    }
    .traveler {
      animation: sweepPulse 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Base Line -->
  <line x1="20" y1="12" x2="880" y2="12" stroke="url(#dividerGrad)" stroke-width="1.2"/>
  
  <!-- Center Accent Diamond -->
  <polygon points="450,7 455,12 450,17 445,12" fill="#00e5ff" filter="url(#glowDiv)"/>
  <circle cx="430" cy="12" r="1.5" fill="#38bdf8"/>
  <circle cx="470" cy="12" r="1.5" fill="#38bdf8"/>

  <!-- Traveling Energy Particle -->
  <circle class="traveler" cx="0" cy="12" r="2.5" fill="#ffffff" filter="url(#glowDiv)"/>
</svg>