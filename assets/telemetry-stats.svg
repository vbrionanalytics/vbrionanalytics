<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="110">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#040b15"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <filter id="glowPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes heartbeat {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }
    @keyframes signalWave {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes borderSheen {
      0%, 100% { stroke-opacity: 0.35; }
      50% { stroke-opacity: 0.8; }
    }
    .pulse-dot {
      animation: heartbeat 1.6s ease-in-out infinite;
      transform-origin: center;
    }
    .sheen {
      animation: borderSheen 2.5s ease-in-out infinite;
    }
    .wave-line {
      stroke-dasharray: 6 3;
      animation: signalWave 2s linear infinite;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    }
  </style>

  <!-- Container Group -->
  <g transform="translate(0, 0)">
    
    <!-- CARD 1: Latency Mesh -->
    <g transform="translate(4, 5)">
      <rect x="0" y="0" width="214" height="100" rx="10" fill="url(#cardGrad)" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1.2" class="sheen"/>
      <circle class="pulse-dot" cx="22" cy="24" r="4.5" fill="#00e5ff" filter="url(#glowPulse)"/>
      <text x="34" y="27" fill="#67e8f9" font-size="10" font-weight="700" letter-spacing="1" class="font-sans">REAL-TIME INFERENCE</text>
      <text x="22" y="62" fill="url(#accentCyan)" font-size="25" font-weight="900" class="font-mono">&lt; 15ms</text>
      <text x="22" y="84" fill="#94a3b8" font-size="11" font-weight="500" class="font-sans">Latency Telemetry Mesh</text>
      <line x1="140" y1="56" x2="198" y2="56" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" class="wave-line"/>
    </g>

    <!-- CARD 2: Regulatory Defense -->
    <g transform="translate(228, 5)">
      <rect x="0" y="0" width="214" height="100" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" class="sheen"/>
      <circle class="pulse-dot" cx="22" cy="24" r="4.5" fill="#10b981" filter="url(#glowPulse)"/>
      <text x="34" y="27" fill="#6ee7b7" font-size="10" font-weight="700" letter-spacing="1" class="font-sans">REGULATORY DEFENSE</text>
      <text x="22" y="62" fill="url(#accentGreen)" font-size="25" font-weight="900" class="font-mono">100%</text>
      <text x="22" y="84" fill="#94a3b8" font-size="11" font-weight="500" class="font-sans">Audit Readiness Guarantee</text>
    </g>

    <!-- CARD 3: Product Engineering Uptime -->
    <g transform="translate(452, 5)">
      <rect x="0" y="0" width="214" height="100" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.2" class="sheen"/>
      <circle class="pulse-dot" cx="22" cy="24" r="4.5" fill="#818cf8" filter="url(#glowPulse)"/>
      <text x="34" y="27" fill="#a5b4fc" font-size="10" font-weight="700" letter-spacing="1" class="font-sans">SYSTEM ENDURANCE</text>
      <text x="22" y="62" fill="url(#accentPurple)" font-size="25" font-weight="900" class="font-mono">99.99%</text>
      <text x="22" y="84" fill="#94a3b8" font-size="11" font-weight="500" class="font-sans">Enterprise Platform Uptime</text>
    </g>

    <!-- CARD 4: Deployed Pipelines -->
    <g transform="translate(676, 5)">
      <rect x="0" y="0" width="220" height="100" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.2" class="sheen"/>
      <circle class="pulse-dot" cx="22" cy="24" r="4.5" fill="#fbbf24" filter="url(#glowPulse)"/>
      <text x="34" y="27" fill="#fde68a" font-size="10" font-weight="700" letter-spacing="1" class="font-sans">PRODUCTION RIGOR</text>
      <text x="22" y="62" fill="url(#accentAmber)" font-size="25" font-weight="900" class="font-mono">109+</text>
      <text x="22" y="84" fill="#94a3b8" font-size="11" font-weight="500" class="font-sans">ML &amp; Analytics Pipelines</text>
    </g>

  </g>
</svg>